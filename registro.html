<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/style2.css">
        <title>Registro</title>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link rel="icon" href="logo.png">
        <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.1.9/dist/sweetalert2.min.js"></script>
    </head>
    <body>
        <section>
            <div class="container">
                <div class="formulario">
                    <h2>Regístrate</h2>
                    <form action="php/registro.php" method="post" class="form-columns">
                        <div class="column">
                            <div class="input-contenedor">
                                <input type="text" name="nombre" id="nombre" required>
                                <label for="#">Nombre(s)</label>
                            </div>
                            <div class="input-contenedor">
                                <input type="text" name="apellido_m" required>
                                <label for="#">Apellido Materno</label>
                            </div>
                            <div class="input-contenedor">
                                <input type="email" name="correo" required>
                                <label for="#">Correo</label>
                            </div>
                            <div class="input-contenedor">
                                <input id="p1_txt" type="password" name="contraseña" required>
                                <label for="#">Contraseña</label>
                            </div>
                        </div>
                        <div class="column">
                            <div class="input-contenedor">
                                <input type="text" name="apellido_p" required>
                                <label for="#">Apellido Paterno</label>
                            </div>
                            <div class="input-contenedor">
                                <input type="text" name="telefono" id="telefono_txt" required>
                                <label for="#">Teléfono</label>
                            </div>
                            <div class="input-contenedor">
                                <input type="email" name="correo_confirm" required>
                                <label for="#">Confirmar Correo</label>
                            </div>
                            <div class="input-contenedor">
                                <input id="p2_txt" type="password" name="contraseña_confirm" required>
                                <label for="#">Confirmar Contraseña</label>
                            </div>
                        </div>
                        <div class="input-contenedor full-width">
                            <button class="btn btn-outline-warning">Registrar</button>
                            <div class="registrar">
                                <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>
        <script src="java/ajax.js"></script>
        <script src="java/registro.js"></script>
        <script src="js/bootstrap.bundle.min.js"></script>
    </body>
</html>
